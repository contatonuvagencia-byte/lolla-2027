<style id="css">
/* Layout: festival wristband hero, a ticket-stub summary, then cost cards, two money trackers and the timeline */
:root{
  --paper:#F4F1F8;--card:#FFFFFF;--ink:#1D1330;--muted:#6B6180;--line:#E2DCEB;
  --hot:#D2367E;--hot-ink:#FFFFFF;--sky:#2F6FDB;--ok:#1F8A5B;--okbg:#E3F4EA;--warn:#9A6514;--warnbg:#FBF0DC;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"DM Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#140E1F;--card:#1F1830;--ink:#F1EDF7;--muted:#A69CBB;--line:#352B4A;
  --hot:#FF5FA2;--hot-ink:#1A0B14;--sky:#7EA8FF;--ok:#5CD39A;--okbg:#173326;--warn:#F2B85B;--warnbg:#3A2C12;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#140E1F;--card:#1F1830;--ink:#F1EDF7;--muted:#A69CBB;--line:#352B4A;
  --hot:#FF5FA2;--hot-ink:#1A0B14;--sky:#7EA8FF;--ok:#5CD39A;--okbg:#173326;--warn:#F2B85B;--warnbg:#3A2C12;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700}
.lab{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.save{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0;font-size:12px;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;z-index:5}
.save:empty{display:none}

.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.hero .eyebrow{margin:0 0 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--hot);font-weight:700}
.hero h1{font-size:clamp(44px,11vw,88px);line-height:.9;font-weight:800;letter-spacing:-.03em}
.hero h1 span{color:var(--hot)}
.hero .sub{margin:10px 0 0;color:var(--muted)}
.count{display:flex;align-items:baseline;gap:8px;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:14px}
.count b{font-family:var(--f-mono);font-size:32px}
.count span{font-size:13px}

.stub{display:flex;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:18px;position:relative;overflow:hidden}
.stub-main{flex:2 1 320px;padding:22px;display:grid;gap:12px;min-width:0}
.stub-side{flex:1 1 220px;padding:22px;display:grid;gap:18px;border-left:2px dashed var(--line);position:relative;min-width:0}
.stub-side::before,.stub-side::after{content:"";position:absolute;left:-11px;width:20px;height:20px;border-radius:50%;background:var(--paper)}
.stub-side::before{top:-11px}.stub-side::after{bottom:-11px}
.stat b{font-size:22px;display:block;margin-top:2px}
.stat.big b{font-size:clamp(30px,7vw,44px);color:var(--hot)}
.of{color:var(--muted);font-size:13px}
.bar{height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hot);border-radius:999px;transition:width .4s}
.bar.sky i{background:var(--sky)}
.bar.ok i{background:var(--ok)}
.pct{margin:0;font-size:13px;color:var(--muted)}
.split{margin:0;font-size:13px;color:var(--muted)}

.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.sec-head h2{font-size:24px;font-weight:800}
.sec-head p{margin:0;color:var(--muted);font-size:13px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:8px;align-content:start;min-width:0}
.item.is-paid{border-color:var(--ok)}
.item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.item h3{font-size:17px;font-weight:600}
.when{margin:0;color:var(--muted);font-size:13px}
.item-val{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cur{font-family:var(--f-mono);color:var(--muted);font-size:14px}
input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.item-val input{font-family:var(--f-mono);font-weight:700;font-size:18px;width:9ch;flex:1 1 9ch}
input:focus-visible,button:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--warnbg);color:var(--warn)}
.tag.fixed{background:var(--okbg);color:var(--ok)}
button{font:inherit;cursor:pointer}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok);border-color:transparent}

.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.panels{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:14px;align-content:start;min-width:0}
.panel h2{font-size:22px;font-weight:800}
.hint{margin:4px 0 0;color:var(--muted);font-size:13px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trio b{font-size:15px;display:block}
.tip{margin:0;font-size:13px;background:var(--paper);border-radius:10px;padding:10px 12px}
.tip b{font-family:var(--f-mono)}
.add{display:flex;flex-wrap:wrap;gap:8px}
.add input[type=number]{flex:1 1 110px;font-family:var(--f-mono)}
.add input[type=month]{flex:1 1 130px}
.add button{background:var(--hot);color:var(--hot-ink);border:0;border-radius:10px;padding:8px 16px;font-weight:700}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.log li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--paper);font-size:14px}
.log li span{flex:1}
.log li.empty{color:var(--muted);font-size:13px}
.del{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.del:hover{color:var(--hot)}

.timeline{list-style:none;margin:0;padding:0;display:grid;gap:0}
.timeline li{display:grid;grid-template-columns:110px 22px 1fr;gap:12px;align-items:start;padding-bottom:16px;position:relative}
.timeline .q{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-top:1px}
.timeline .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--card);margin-top:3px;position:relative;z-index:1}
.timeline li:not(:last-child)::after{content:"";position:absolute;left:calc(110px + 12px + 7px);top:22px;bottom:0;width:2px;background:var(--line)}
.timeline li.done .dot{background:var(--ok);border-color:var(--ok)}
.timeline li.done .t{color:var(--muted);text-decoration:line-through}
.timeline li.final .dot{background:var(--hot);border-color:var(--hot)}
.timeline .t{margin:0}
@media (max-width:480px){.timeline li{grid-template-columns:72px 22px 1fr}.timeline li:not(:last-child)::after{left:calc(72px + 12px + 7px)}}
.mode{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.mode p{margin:0;font-size:13px;color:var(--muted);flex:1 1 240px}
.mode p b{color:var(--ink)}
.seg{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:14px;padding:7px 16px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--hot);color:var(--hot-ink)}
.share{margin:0;font-size:13px;color:var(--ok);font-weight:700}
.share s{color:var(--muted);font-weight:400}
.why{margin:-4px 0 0;font-size:12px;color:var(--muted)}
.plano{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.plano li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px;min-width:0}
.plano li.voo{border-color:var(--hot);background:color-mix(in srgb,var(--hot) 7%,var(--card))}
.plano .pm{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.plano .pm small{text-transform:none;letter-spacing:0;font-weight:500}
.plano b{font-size:20px}
.plano .pd{font-size:12px;color:var(--muted)}
.mode .seg button{font-size:13px;padding:6px 12px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.stay{border:2px solid var(--hot);border-radius:20px;padding:18px;background:color-mix(in srgb,var(--hot) 6%,var(--card));display:grid;gap:12px}
.stay h2{margin:0;font-size:18px}.stay .nm{margin:2px 0 0;color:var(--muted);font-size:14px}
.stay-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stay-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:2px}
.stay-box .lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stay-box b{font-size:24px;line-height:1.1}.stay-box span.d{font-size:13px;color:var(--muted)}
.stay-box.alert{border-color:var(--hot);background:var(--hot);color:var(--hot-ink)}.stay-box.alert .lab,.stay-box.alert span.d{color:var(--hot-ink);opacity:.9}
.stay .planb{margin:0;font-size:13px;color:var(--warn);background:var(--warnbg);border-radius:10px;padding:8px 12px}
</style>

    {q:'19 a 22/03',t:'Lolla, passeios e Sweater Weather a plenos pulmões',d:false,f:true}
  ].map(function(s){return '<li class="'+(s.d?'done':'')+(s.f?' final':'')+'"><span class="q">'+s.q+'</span><span class="dot" aria-hidden="true"></span><p class="t">'+s.t+'</p></li>'}).join('');
  $('#app').innerHTML=
  '<div class="wrap">'+
  '<header class="hero"><div><p class="eyebrow">Interlagos · São Paulo</p><h1>Lolla <span>2027</span></h1><p class="sub">19 a 22 de março · The Neighbourhood na mira</p></div>'+
  '<div class="count"><b>'+c.dias+'</b><span>dias pro festival</span></div></header>'+
  (function(){var h=get('hotel');if(!h||!(h.cancelaAte||h.entrada))return '';var ca=h.cancelaAte||'',dl=new Date(ca+'T23:59:00-03:00'),hoje=new Date(),fal=Math.ceil((dl-hoje)/864e5),dd=ca.split('-');return '<section class="stay" aria-label="Sua hospedagem"><div><h2>🏠 Sua hospedagem</h2><p class="nm">'+esc(h.nome)+'</p></div><div class="stay-grid">'+
'<div class="stay-box"><span class="lab">Entrada</span><b>'+esc(h.entrada||'')+'</b><span class="d">'+esc(h.entradaDia||'')+'</span></div>'+
'<div class="stay-box"><span class="lab">Saída</span><b>'+esc(h.saida||'')+'</b><span class="d">'+esc(h.saidaDia||'')+'</span></div>'+
'<div class="stay-box alert"><span class="lab">Cancela grátis até</span><b>'+(ca?dd[2]+'/'+dd[1]+'/'+dd[0]:'A confirmar')+'</b><span class="d">'+(ca?(fal>0?'às 23h59 · faltam '+fal+' dias':'prazo encerrado'):esc(h.cancelaNota||'Pergunta pro hotel'))+'</span></div></div>'+
(h.planoB?'<p class="planb">Plano B: '+esc(h.planoB)+'</p>':'')+'</section>'})()+
'<section class="mode" aria-label="Versão do plano"><div class="seg" role="group">'+[['v4','Recomendada'],['v1','Sozinha · mãe até dez'],['v2','Sozinha · mãe até mar'],['v3','Com amiga']].map(function(o){return '<button type="button" id="ver-'+o[0]+'" data-ver="'+o[0]+'" aria-pressed="'+(ver()===o[0])+'">'+o[1]+'</button>'}).join('')+'</div>'+
  (ver()==='v4'?'<p>Feita pras suas contas: o <b>voo vai no cartão como uma conta normal</b>, a mãe fica <b>quitada em novembro e dezembro</b> e o cofrinho pesa <b>quando o celular sai da fatura</b>.</p>':ver()==='v1'?'<p>Outubro fica livre. Você quita a <b>mãe em novembro e dezembro</b>, compra a <b>passagem em novembro</b> e guarda o resto <b>de dezembro a março</b>.</p>':
   ver()==='v2'?'<p>Passagem em <b>novembro</b>, e a mãe e o resto vão sendo guardados <b>todo mês até 11/03</b>.</p>':
   (function(){var eco=S.items.reduce(function(t,i){return t+(split(i)?(Number(i.valor)||0)-part(i):0)},0),volta=part(get('vooamiga'));return '<div class="seg" role="group" aria-label="Quando ela chega"><button type="button" id="cheg-sex" data-cheg="sex" aria-pressed="'+(cheg()==='sex')+'">Ela chega sexta à noite</button><button type="button" id="cheg-sab" data-cheg="sab" aria-pressed="'+(cheg()==='sab')+'">Ela chega sábado</button></div><p>Apê e Uber divididos <b>pelo tempo que cada uma fica</b>, ela paga o ônibus e você banca a <b>volta dela</b> junto com a sua passagem em novembro. '+(eco-volta>=0?'Você fica <b>'+brl(eco-volta)+'</b> no lucro':'Sai <b>'+brl(volta-eco)+'</b> a mais')+' comparado a ir sozinha.</p>'})())+'</section>'+
  '<section class="stub" aria-label="Resumo"><div class="stub-main"><div class="stat big"><span class="lab">Já separei</span><b class="num">'+brl(c.separado)+'</b><span class="of">de '+brl(c.total)+' da viagem toda</span></div>'+
  '<div class="bar"><i style="width:'+c.pct.toFixed(1)+'%"></i></div><p class="pct">'+Math.round(c.pct)+'% da viagem garantida</p></div>'+
  '<div class="stub-side">'+(function(){var ps=c.plano.filter(function(m){return m.tot>0.005}),f={tot:0,nome:'-'},mx=ps.reduce(function(a,m){return m.tot>a.tot?m:a},ps[0]||f),mn=ps.reduce(function(a,m){return m.tot<a.tot?m:a},ps[0]||f);return '<div class="stat"><span class="lab">Mês mais pesado · '+mx.nome+'</span><b class="num">'+brl(mx.tot)+'</b></div><div class="stat"><span class="lab">Mês mais leve · '+mn.nome+'</span><b class="num">'+brl(mn.tot)+'</b><span class="of">tudo pronto até 11/03</span></div>'})()+
  '<div class="stat"><span class="lab">Ainda falta</span><b class="num">'+brl(c.falta)+'</b></div></div></section>'+
  '<section><div class="sec-head"><h2>Plano mês a mês</h2><p>'+(ver()==='v4'?'Mãe quitada até dezembro, o grosso do cofrinho de janeiro a março. Voo fora daqui, na fatura.':ver()==='v1'?'Mãe até dezembro, voo em novembro, resto até 11/03.':'Voo em novembro, o resto dividido até 11/03.')+'</p></div><ol class="plano">'+c.plano.map(function(m){var pz=[];if(m.mae>0.005)pz.push(brl(m.mae)+' mãe');if(m.voo>0.005)pz.push(brl(m.voo)+(ver()==='v3'?' voos':' voo'));if(m.cof>0.005)pz.push(brl(m.cof)+' cofrinho');if(ver()==='v4'&&m.voo>0.005)pz=pz.map(function(x){return x.replace(' voo',' parcela do voo')});return '<li'+((ver()!=='v4'&&m.voo>0.005)||m.nota?' class="voo"':'')+'><span class="pm">'+m.nome+(m.ult?' <small>até 11</small>':'')+'</span><b class="num">'+brl(m.tot)+'</b><span class="pd">'+(m.nota||pz.join(' · ')||'nada a guardar')+'</span></li>'}).join('')+'</ol></section>'+
  '<section><div class="sec-head"><h2>Os gastos</h2><p>Toca no valor pra ajustar. Marca como pago quando sair do bolso.</p></div><div class="items">'+items+'</div></section>'+
  '<div class="panels">'+
  '<section class="panel"><div><h2>Devolver pra mãe</h2><p class="hint">Ela adianta o ingresso, você devolve aos pouquinhos.</p></div>'+
  '<div class="trio"><div><span class="lab">Emprestado</span><b class="num">'+brl(c.ingresso)+'</b></div><div><span class="lab">Devolvido</span><b class="num">'+brl(c.devolvido)+'</b></div><div><span class="lab">Falta</span><b class="num">'+brl(c.maeFalta)+'</b></div></div>'+
  '<div class="bar sky"><i style="width:'+c.maePct.toFixed(1)+'%"></i></div>'+
  '<p class="tip">'+(c.maeFalta&&ver()==='v4'?(c.maeNov>0?'<b>'+brl(c.maeNov)+'</b> em novembro e ':'')+'<b>'+brl(c.maeFalta-c.maeNov)+'</b> em dezembro. Quitada antes do Natal.':c.maeFalta?'Devolvendo <b>'+brl(c.maeFalta/c.maeN)+'</b> por mês, você quita até '+(ver()==='v1'?'dezembro':'11/03')+'.':'Mãe quitada. Ela merece um abraço e um souvenir.')+'</p>'+
  '<form class="add" data-form="mae"><input id="mae-v" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Valor" aria-label="Valor devolvido"><input id="mae-d" type="month" value="'+ym()+'" aria-label="Mês"><button type="submit">Registrar</button></form>'+
  '<ul class="log">'+log(S.mae,'mae')+'</ul></section>'+
  '<section class="panel"><div><h2>Cofrinho do Lolla</h2><p class="hint">'+(ver()==='v4'?'Apê, transporte, comida, passeios e a reserva. O voo vai na fatura.':'Voo, apê, transporte, comida, passeios e a reserva.')+'</p></div>'+
  '<div class="trio"><div><span class="lab">Meta</span><b class="num">'+brl(c.cofreMeta)+'</b></div><div><span class="lab">Guardado</span><b class="num">'+brl(c.guardado)+'</b></div><div><span class="lab">Falta</span><b class="num">'+brl(c.cofreFalta)+'</b></div></div>'+
  '<div class="bar ok"><i style="width:'+c.cofrePct.toFixed(1)+'%"></i></div>'+
  '<p class="tip">'+(c.cofreFalta?(ver()==='v4'?'O voo fica na fatura como conta normal. <b>'+brl(c.dezG)+'</b> em dezembro e uns <b>'+brl((c.resto-c.dezG)/3)+'</b> por mês de janeiro a março.':c.primeiro>0?'<b>'+brl(c.primeiro)+'</b> pro voo em novembro e <b>'+brl(c.resto/c.restN)+'</b> por mês depois, tudo pago até 11/03.':'Guardando <b>'+brl(c.resto/c.restN)+'</b> por mês, você chega lá com tudo pago até 11/03.'):'Cofrinho cheio. Agora é só curtir.')+'</p>'+
  '<form class="add" data-form="cofre"><input id="cofre-v" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Valor" aria-label="Valor guardado"><input id="cofre-d" type="month" value="'+ym()+'" aria-label="Mês"><button type="submit">Guardar</button></form>'+
  '<ul class="log">'+log(S.cofre,'cofre')+'</ul></section>'+
  '</div>'+
  '<section><div class="sec-head"><h2>Linha do tempo</h2><p>Vai riscando conforme acontece.</p></div><ol class="timeline">'+steps+'</ol></section>'+
  '</div>';
  bind();
}
function bind(){
  document.querySelectorAll('[data-cheg]').forEach(function(b){b.onclick=function(){if(cheg()===b.dataset.cheg)return;S.chegada=b.dataset.cheg;commit()}});
  document.querySelectorAll('[data-ver]').forEach(function(b){b.onclick=function(){if(ver()===b.dataset.ver)return;S.versao=b.dataset.ver;S.amiga=S.versao==='v3';commit()}});
  document.querySelectorAll('[data-toggle]').forEach(function(b){b.onclick=function(){var i=get(b.dataset.toggle);i.pago=!i.pago;commit()}});
  document.querySelectorAll('[data-val]').forEach(function(inp){inp.onchange=function(){var v=parseFloat(String(inp.value).replace(',','.'));if(isNaN(v)||v<0)return;var i=get(inp.dataset.val);i.valor=Math.round(v*100)/100;i.est=false;commit()}});
  document.querySelectorAll('[data-form]').forEach(function(f){f.onsubmit=function(e){e.preventDefault();var k=f.dataset.form;var v=parseFloat(String($('#'+k+'-v').value).replace(',','.'));if(isNaN(v)||v<=0)return;S[k].push({d:$('#'+k+'-d').value||ym(),v:Math.round(v*100)/100});commit()}});
  document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){var p=b.dataset.del.split(':');S[p[0]].splice(+p[1],1);commit()}});
}
var PAGINA="planner";
function status(t){var el=$('#save');if(el)el.textContent=t}
function commit(){
  render();status('Salvando');clearTimeout(timer);
  timer=setTimeout(function(){Lolla.save(PAGINA,S).then(function(){status('Tudo salvo')}).catch(function(){status('Não salvou. Confere a internet e tenta de novo.')})},600);
}
Lolla.boot(PAGINA,function(d){if(d)S=d;render()});
})();
</script>
